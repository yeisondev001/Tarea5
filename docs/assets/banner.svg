<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121414"/>
      <stop offset="1" stop-color="#1e2020"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe285"/>
      <stop offset="1" stop-color="#e8c547"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- caja (silueta) -->
  <g transform="translate(150,150)">
    <rect x="-90" y="-10" width="180" height="80" rx="10" fill="#1a1c1c" stroke="#e8c547" stroke-width="3"/>
    <path d="M -90 -10 Q 0 -55 90 -10" fill="none" stroke="#e8c547" stroke-width="3"/>
    <rect x="-16" y="-30" width="32" height="22" rx="4" fill="#e8c547"/>
    <line x1="-60" y1="10" x2="60" y2="10" stroke="#333535" stroke-width="2"/>
    <line x1="-60" y1="30" x2="60" y2="30" stroke="#333535" stroke-width="2"/>
  </g>

  <!-- titulo -->
  <text x="300" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="url(#gold)">Caja de Herramientas</text>
  <text x="305" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#e2e2e2">7 herramientas reales consumiendo APIs públicas</text>
  <text x="305" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#98907b">Flutter · Animaciones · Sonido sincronizado</text>

  <rect x="305" y="250" width="170" height="6" rx="3" fill="url(#gold)"/>
  <rect x="495" y="250" width="60" height="6" rx="3" fill="#333535"/>
</svg>
